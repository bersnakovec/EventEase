name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/EventEase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/EventEase/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Neuspešen test ali pokritost pod pragom (90 % vrstic/funkcij, 85 % vej) ustavi cevovod.
      - name: Unit tests + coverage
        run: |
          set -o pipefail
          npm run test:coverage | tee test-output.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Frontend unit test coverage"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/EventEase/coverage/lcov.info
            frontend/EventEase/test-output.txt
          if-no-files-found: warn

      - run: npm run build

  backend:
    name: Backend (Zig)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/logic
    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - run: zig build

      # Neuspešen test ustavi cevovod.
      - run: zig build test --summary all

      - name: Coverage (kcov)
        run: |
          zig build test-bin
          mkdir -p coverage
          for t in zig-out/bin/*-tests; do
            docker run --rm --security-opt seccomp=unconfined \
              -v "$PWD:$PWD" -w "$PWD" kcov/kcov:latest \
              kcov --include-path="$PWD/src" "coverage/$(basename "$t")" "$t"
          done
          docker run --rm -v "$PWD:$PWD" -w "$PWD" kcov/kcov:latest \
            kcov --merge coverage/merged coverage/*-tests
          sudo chown -R "$(id -u):$(id -g)" coverage

      - name: Coverage summary + threshold
        run: python3 ../../scripts/zig-coverage-summary.py coverage/merged/kcov-merged/coverage.json 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/logic/coverage/merged
          if-no-files-found: warn

  docker-smoke:
    name: Docker + API smoke
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - run: docker compose build

      - run: docker compose up -d

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ && break
            sleep 2
          done

      - run: sudo apt-get update && sudo apt-get install -y jq

      - run: bash scripts/ci-smoke-test.sh http://localhost:8080

      - if: always()
        run: docker compose down -v
